name: Tests on every platform
run-name: ${{ inputs.reason }}

# By hand only, with the reason as the run's title.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run is worth starting
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: ${{ matrix.target }}
    runs-on: macos-arm64
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The Intel tests run under Rosetta.
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../target
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          set -euo pipefail
          rust=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | sed -n 1p)
          rustup toolchain install "$rust" --profile minimal --target ${{ matrix.target }}
          echo "open files: $(ulimit -n)"
          cargo "+$rust" test --release --locked --no-fail-fast --target ${{ matrix.target }}

  # Linux on Arm runs natively in Apple's `container` on the Mac. The
  # source is copied into each container's own disk first: built in a
  # folder shared from macOS, the tests fail to compile.
  linux-arm64:
    name: aarch64-unknown-linux-${{ matrix.libc }}
    runs-on: macos-arm64
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        libc: [gnu, musl]
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          set -euo pipefail
          export PATH="/usr/local/bin:$PATH"
          container system status > /dev/null 2>&1 || container system start
          rust=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | sed -n 1p)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | sed -n 1p)
          uid=$(id -u)
          if [ "${{ matrix.libc }}" = musl ]; then
            # Alpine 3.24.2, as the release uses.
            container run --rm --memory 8G --cpus 6 --volume "$PWD:/statac" \
              alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 \
              sh -euc "cp -a /statac /build && chown -R $uid /build && cd /build &&
                sh tools/build-static.sh '$version' '$rust' aarch64-unknown-linux-musl $uid packages"
          else
            # Ubuntu 22.04, for the oldest glibc a release supports.
            container run --rm --memory 8G --cpus 6 --volume "$PWD:/statac" \
              ubuntu@sha256:88881eb36da489f9ff8746ece8048ca16cc94f80e8cd3ae7e8335d8822631591 \
              bash -euo pipefail -c "
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                  ca-certificates curl build-essential cmake perl > /dev/null
                useradd -m -u $uid tester
                cp -a /statac /build && chown -R $uid /build
                runuser -u tester -- env HOME=/home/tester bash -euo pipefail -c '
                  cd /build
                  curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs |
                    sh -s -- -y -q --profile minimal --default-toolchain $rust
                  . \$HOME/.cargo/env
                  cargo test --release --locked --no-fail-fast --target aarch64-unknown-linux-gnu'"
          fi

  linux-x86_64:
    name: x86_64-unknown-linux-${{ matrix.libc }}
    # Steps run as root in Ubuntu 22.04, with the runner's Podman socket at
    # /var/run/docker.sock.
    runs-on: linux-x86_64
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        libc: [gnu, musl]
    env:
      FETCH_TOKEN: ${{ github.token }}
    steps:
      # The image has no Node.js for a JavaScript action, so git fetches
      # the source.
      - run: |
          set -euo pipefail
          tools="git ca-certificates curl"
          if [ "${{ matrix.libc }}" = musl ]; then tools="$tools docker.io"
          else tools="$tools build-essential cmake nasm perl"; fi
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $tools > /dev/null
          git init -q .
          auth=$(printf 'x:%s' "$FETCH_TOKEN" | base64 -w0)
          git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          # Root may read anything, and the tests of a file Statac may not
          # read need a user who may not.
          useradd -m -u 1000 tester
          chown -R 1000:1000 "$PWD"
      - run: |
          set -euo pipefail
          rust=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | sed -n 1p)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | sed -n 1p)
          if [ "${{ matrix.libc }}" = musl ]; then
            # Alpine 3.24.2, as the release uses. --volumes-from gives it
            # this job's files, which a --volume of $PWD would not.
            docker run --rm --volumes-from "$(hostname)" --workdir "$PWD" \
              alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 \
              sh tools/build-static.sh "$version" "$rust" x86_64-unknown-linux-musl 1000 packages
          else
            runuser -u tester -- env HOME=/home/tester bash -euo pipefail -c "
              curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs |
                sh -s -- -y -q --profile minimal --default-toolchain $rust
              . \$HOME/.cargo/env
              cargo test --release --locked --no-fail-fast --target x86_64-unknown-linux-gnu"
          fi

  # The Mac's runner drives a Windows machine over SSH, which the runner's
  # account knows as `statac-windows`. The machine runs no runner of its
  # own, and the job fails if it is switched off.
  windows:
    name: x86_64-pc-windows-msvc
    runs-on: macos-arm64
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          set -euo pipefail
          ssh statac-windows exit || {
            echo "::error::The Windows machine can't be reached. Is it switched on?"
            exit 1
          }
          rust=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | sed -n 1p)
          # A zip, whose names git marks as UTF-8.
          git archive --format=zip HEAD > ../source.zip
          cat > ../tests.ps1 <<'SCRIPT'
          param([string]$rust)
          $env:Path = "$env:USERPROFILE\.cargo\bin;C:\Program Files\Git\cmd;C:\Program Files\Git\usr\bin;C:\Program Files\CMake\bin;C:\Program Files\NASM;" + $env:Path
          # As the release links it: no C runtime to install first.
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          $env:CARGO_TARGET_DIR = "$env:USERPROFILE\build\target"
          $source = "$env:USERPROFILE\build\source"
          if (Test-Path $source) { Remove-Item -Recurse -Force $source }
          New-Item -ItemType Directory -Force $source | Out-Null
          # Windows' own tar writes a name only where the machine's code page
          # holds it, which a Japanese one isn't.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          try { [IO.Compression.ZipFile]::ExtractToDirectory("$env:USERPROFILE\source.zip", $source) }
          catch { $_; exit 1 }
          # The zip dates every file at its commit, which can be older than
          # what an earlier run built into the kept target folder, and cargo
          # would then take a changed file as built. Dated now, as a checkout
          # dates them.
          $now = Get-Date
          try { Get-ChildItem -LiteralPath $source -Recurse -File -Force -ErrorAction Stop | ForEach-Object { $_.LastWriteTime = $now } }
          catch { $_; exit 1 }
          Remove-Item "$env:USERPROFILE\source.zip"
          Set-Location $source
          cmd /c "rustup toolchain install $rust --profile minimal 2>&1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "cargo +$rust test --release --locked --no-fail-fast --target x86_64-pc-windows-msvc 2>&1"
          exit $LASTEXITCODE
          SCRIPT
          scp -q ../source.zip ../tests.ps1 statac-windows:
          ssh statac-windows powershell -NoProfile -ExecutionPolicy Bypass -File tests.ps1 "$rust"
