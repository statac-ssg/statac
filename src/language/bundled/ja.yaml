# How dates are written, in the CLDR's own patterns. These are Statac's alone:
# a site's file for the language can't change them.
dates:
  long: y年M月d日
  short: y/MM/dd
  day: M月d日
  time: H:mm
  date_and_time: "{1} {0}"
  month_and_year: y年M月
  month_short_and_year: y年M月
  year: y年
