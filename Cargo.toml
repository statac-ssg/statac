[package]
name = "statac"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "The friendly static site generator."
license = "MIT OR Apache-2.0"
repository = "https://github.com/statac-ssg/statac"
homepage = "https://statac.dev"
publish = false

[workspace]
members = ["crates/avif-aom-sys"]
default-members = [".", "crates/avif-aom-sys"]

[dependencies]
avif-aom-sys = { path = "crates/avif-aom-sys" }
blake3 = "1.8.7"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
codemap = "=0.1.3"
ferriki-textmate = "=1.0.0"
granit-parser = "=1.3.0"
grass = { version = "=0.13.4", default-features = false }
http = "1.5.0"
httparse = "1.10.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
jpeg-encoder = "0.7.1"
math-core = "=0.8.2"
miniz_oxide = "0.9.1"
minijinja = { version = "=2.24.0", default-features = false, features = ["builtins", "debug", "macros", "multi_template", "adjacent_loop_items", "std_collections", "serde", "loop_controls", "unstable_machinery", "fuel"] }
moxcms = "0.8"
notify = { version = "=9.0.0-rc.5", default-features = false, features = ["macos_fsevent"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
rayon = "1.12.0"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde = "1.0.228"
unicode-normalization = "0.1.25"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
url = "2.5.8"
toml = { version = "1.1", default-features = false, features = ["parse"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }

# musl's own allocator slows to a crawl under many threads.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
