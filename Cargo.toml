[package]
name = "statac"
version = "0.7.3"
edition = "2024"
rust-version = "1.99"
description = "A friendlier static site generator."
license = "MIT OR Apache-2.0"
repository = "https://git.statac.dev/statac/statac"
homepage = "https://statac.dev"
documentation = "https://statac.dev"
# crates.io shows both of README.md's light and dark images, so it has a README of its own.
readme = "crates-io.md"
keywords = ["static-site", "ssg", "markdown", "website", "blog"]
categories = ["command-line-utilities", "web-programming"]
include = [
    "/src/",
    "/descriptions/",
    "/explanations/",
    "/licences/",
    "/CHANGELOG.md",
    "/crates-io.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/THIRD-PARTY.md",
    "/THIRD-PARTY-GRAMMARS.md",
]

[workspace]
members = ["crates/statac-avif-sys", "crates/minijinja"]
# Not 3, which prefers dependencies for the oldest Rust any member asks for, the engine's copy's 1.70.
resolver = "2"
default-members = [".", "crates/statac-avif-sys"]

[dependencies]
blake3 = "1.8.7"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
# Its `SpanLoc` is how grass hands over a warning's place (src/assets/sass.rs), so it moves with grass.
codemap = "=0.1.3"
deunicode = "1.6.2"
# src/highlight/styles.rs is written by tokenising with it, and a test fails if that changes.
ferriki-textmate = "=1.1.1"
# Its error kinds are matched one by one, and its spans put right, in src/yaml/parser.rs.
granit-parser = "=1.3.0"
# Its error words are matched as written, in src/assets/sass/fault.rs.
grass = { version = "=0.13.4", default-features = false }
http = "1.5.0"
httparse = "1.10.1"
icu_properties = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
jpeg-encoder = "0.7.1"
# Its error labels and messages are matched as written, in src/markdown/maths.rs.
math-core = "=0.8.2"
miniz_oxide = "0.9.1"
# Statac's changed copy of the template engine, whose changes follow no semver promise.
minijinja = { package = "statac-minijinja", path = "crates/minijinja", version = "=3.0.1", default-features = false, features = ["builtins", "debug", "macros", "multi_template", "adjacent_loop_items", "std_collections", "loop_controls", "unstable_machinery", "fuel"] }
moxcms = "0.8"
# A release candidate: without `=`, Cargo would take a later candidate, which may break.
notify = { version = "=9.0.0-rc.5", default-features = false, features = ["macos_fsevent"] }
pagefind_stem = { version = "1.0.0", features = ["arabic", "armenian", "basque", "catalan", "danish", "dutch", "english", "esperanto", "estonian", "finnish", "french", "german", "greek", "hindi", "hungarian", "indonesian", "irish", "italian", "lithuanian", "nepali", "norwegian", "polish", "portuguese", "romanian", "russian", "serbian", "spanish", "swedish", "tamil", "turkish", "yiddish"] }
# src/markdown/read.rs follows where it splits text, table cells, HTML blocks and definition lists.
pulldown-cmark = { version = "=0.13.4", default-features = false }
rayon = "1.12.0"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
statac-avif-sys = { path = "crates/statac-avif-sys", version = "=0.1.1" }
unicode-normalization = "0.1.25"
# src/fetch.rs uses its unversioned modules, which follow no semver promise.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
url = "2.5.8"
toml = { version = "1.1", default-features = false, features = ["parse"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

# musl's own allocator slows to a crawl under many threads.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[lints.rust]
unsafe_code = "forbid"
