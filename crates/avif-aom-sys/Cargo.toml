[package]
name = "avif-aom-sys"
version = "0.1.0"
edition = "2024"
publish = false
links = "avif"
description = "libavif 1.4.2 with libaom 3.15.1, built from vendored source, encode only"
license = "MIT OR Apache-2.0"
repository = "https://git.statac.dev/statac/statac"

[build-dependencies]
cc = "1.6.0"
cmake = "0.1.58"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
