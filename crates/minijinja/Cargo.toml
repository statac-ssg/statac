# Changed from MiniJinja 3.0.1 for Statac: the registry metadata (authors, keywords, docs.rs settings, dev-dependencies but similar-asserts) is dropped, the package is renamed statac-minijinja and described as changed for Statac, and the repository is Statac's.
[package]
name = "statac-minijinja"
version = "3.0.1"
edition = "2021"
rust-version = "1.70"
description = "MiniJinja 3.0.1, by Armin Ronacher, changed for Statac"
license = "Apache-2.0"
repository = "https://git.statac.dev/statac/statac"

[features]
adjacent_loop_items = []
builtins = []
debug = []
default = [
    "builtins",
    "debug",
    "macros",
    "multi_template",
    "adjacent_loop_items",
    "std_collections",
]
fuel = []
internal_debug = []
internal_safe_search = []
json = []
loop_controls = []
macros = []
multi_template = []
preserve_order = ["indexmap"]
serde = ["dep:serde"]
speedups = [
    "v_htmlescape",
    "dep:zmij",
    "dep:itoa",
]
stacker = ["dep:stacker"]
std_collections = []
unicode = [
    "unicode-ident",
    "unicase",
]
unstable_machinery = ["internal_debug"]
unstable_machinery_serde = [
    "serde",
    "unstable_machinery",
    "serde/derive",
]
urlencode = ["percent-encoding"]

[lib]
name = "minijinja"

[dependencies.indexmap]
version = "2.2.0"
optional = true

[dependencies.itoa]
version = "1.0.11"
optional = true

[dependencies.percent-encoding]
version = "2.2.0"
optional = true

[dependencies.serde]
version = "1.0.130"
optional = true

[dependencies.stacker]
version = "0.1.15"
optional = true

[dependencies.unicase]
version = "2.6.0"
optional = true

[dependencies.unicode-ident]
version = "1.0.5"
optional = true

[dependencies.v_htmlescape]
version = "0.15.8"
optional = true

[dependencies.zmij]
version = "1.0.17"
optional = true

[dev-dependencies.similar-asserts]
version = "1.4.2"
