{# takes clip #}
{# A video kept in the site, with its caption if it has one, called as @video("video-1.mp4"): see /videos/ -#}
{% set words = site.data.words[page.language] %}
{% set video = page.video(clip) %}
<figure>
  <video controls preload="metadata"{% if caption is defined %} aria-label="{{ caption | markdown | plain }}"{% endif %}{% if poster is defined %} poster="{{ page.photo(poster).src }}"{% endif %}>
    <source src="{{ video.src }}" type="{{ video.type }}">
    <a href="{{ video.src }}">{{ words.download_video }}</a>
  </video>
  {% if caption is defined %}
  <figcaption>{{ caption | markdown }}</figcaption>
  {% endif %}
</figure>
