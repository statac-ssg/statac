{# takes by #}
{# A quotation with who said it (by) and where it was said (cite), called as @quote("Name", cite="Work"), and closed with @end: see /snippets/ -#}
<figure class="quote">
  <blockquote>
    {{ body }}
  </blockquote>
  {% if by is defined or cite is defined %}
  <figcaption>{% if by is defined %}{{ by | markdown }}{% endif %}{% if by is defined and cite is defined %}, {% endif %}{% if cite is defined %}<cite>{{ cite | markdown }}</cite>{% endif %}</figcaption>
  {% endif %}
</figure>
