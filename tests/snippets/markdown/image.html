{% if image.avif %}
<picture><source type="image/avif" srcset="{{ image.avif }}" sizes="{{ image.sizes }}"><img src="{{ image.src }}" srcset="{{ image.fallback }}" sizes="{{ image.sizes }}" width="{{ image.width }}" height="{{ image.height }}" alt="{{ alt }}"></picture>
{%- else %}
<img src="{{ image.src if image else url }}" alt="{{ alt }}">
{%- endif %}
