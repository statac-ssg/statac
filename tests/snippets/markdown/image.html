{% if photo.avif %}
<picture><source type="image/avif" srcset="{{ photo.avif }}" sizes="{{ photo.sizes }}"><img src="{{ photo.src }}" srcset="{{ photo.fallback }}" sizes="{{ photo.sizes }}" width="{{ photo.width }}" height="{{ photo.height }}" alt="{{ alt }}"></picture>
{%- else %}
<img src="{{ photo.src if photo else address }}" alt="{{ alt }}">
{%- endif %}
